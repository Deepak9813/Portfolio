<!doctype html>
<html lang="en">
  <head>
    <!-- Basic SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="index, follow" />

    <!-- Primary SEO -->
    <title>Deepak Baij | Backend Developer</title>

    <meta
      name="description"
      content="Official portfolio of Deepak Baij, a React Frontend Developer skilled in React.js, JavaScript, HTML, CSS, and modern web development."
    />

    <meta
      name="keywords"
      content="Deepak Baij, Deepak Baij Portfolio, React Developer, Frontend Developer, JavaScript Developer, React.js Portfolio, Web Developer Nepal"
    />

    <meta name="author" content="Deepak Baij" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://deepakbaij.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/images/db_logo.png" />

    <!-- Open Graph SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Deepak Baij | Frontend Developer" />
    <meta
      property="og:description"
      content="Official portfolio website of Deepak Baij built using React.js."
    />
    <meta
      property="og:image"
      content="https://deepakbaij.vercel.app/assets/images/db_logo.png"
    />
    <meta property="og:url" content="https://deepakbaij.vercel.app/" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Deepak Baij | Frontend Developer"
    />
    <meta
      name="twitter:description"
      content="Official portfolio website of Deepak Baij built using React.js."
    />
    <meta
      name="twitter:image"
      content="https://deepakbaij.vercel.app/assets/images/db_logo.png"
    />

    <!-- Structured Data SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Deepak Baij",
        "url": "https://deepakbaij.vercel.app/",
        "image": "https://deepakbaij.vercel.app/assets/images/db_logo.png",
        "jobTitle": "Frontend Developer",
        "sameAs": [
          "https://github.com/",
          "https://linkedin.com/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
